services:
  verify:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      HEADLESS: virtual
      API_TOKEN: ${API_TOKEN:?defina API_TOKEN no .env}  # recusa subir com a API aberta
    volumes:
      - ./profile:/app/profile  # sessão logada do Mercado Livre (logar no Mac e copiar a pasta)
    shm_size: "2gb"  # Firefox trava com o /dev/shm padrão de 64 MB
    init: true       # reaper de processos: evita Camoufox órfão segurando o perfil
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 5s
      start_period: 40s

  # Login/captcha pelo navegador: docker compose stop verify && docker compose --profile login up login
  # Acesse via túnel SSH: ssh -L 6080:localhost:6080 usuario@servidor -> http://localhost:6080/vnc.html?autoconnect=1
  # Termina sozinho após o login (sessão salva em profile/); depois: docker compose start verify
  login:
    profiles: ["login"]
    build: .
    command: ["./login.sh"]
    environment:
      VERIFY_URL: ${VERIFY_URL:-}  # opcional: link de produto para resolver o captcha depois do login
    ports: ["127.0.0.1:6080:6080"]  # só localhost do servidor: nunca expor o noVNC (sem senha) na internet
    volumes:
      - ./profile:/app/profile  # mesmo perfil do verify; não rodar os dois ao mesmo tempo (lock do Firefox)
    shm_size: "2gb"
    init: true
