name: CI/CD

# PR: roda só os testes. Push na main / manual: testes e, se passarem, deploy sequencial nos 2 servidores.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      target:
        description: 'Quais instâncias atualizar'
        type: choice
        options: [both, server1, server2]
        default: both
      sha:
        description: 'Commit a implantar (vazio = HEAD do branch). Use o SHA anterior para fazer rollback.'
        required: false

concurrency:
  group: deploy       # dois deploys nunca se cruzam nos servidores
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip    # camoufox[geoip] arrasta indexed-zstd, que compila com g++: sem cache cada run recompila
          cache-dependency-path: requirements.txt

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Testes unitários
        run: python test_parse.py      # regras de preço/cupom/segurança, sem navegador

      - name: Sintaxe do código não coberto pelos testes
        run: python -m compileall -q app.py login.py

      - name: Sintaxe dos shells
        run: sh -n start.sh login.sh    # o script de deploy é checado no job de deploy

      - name: Validar o docker-compose.yml
        run: |
          cp .env.example .env    # o compose exige o env_file; o .env real nunca sai do servidor
          docker compose config -q

  # A imagem Docker não é construída no CI: baixa ~1,3 GB do Camoufox e levaria dezenas de minutos por run.
  # No deploy o build roda antes do "up -d", então um Dockerfile quebrado falha sem derrubar o container no ar.

  plan:
    if: github.event_name != 'pull_request'   # em PR nada é implantado
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          TARGET: ${{ inputs.target || 'both' }}
        run: |
          case "$TARGET" in
            server1) m='{"server":[1]}' ;;
            server2) m='{"server":[2]}' ;;
            *)       m='{"server":[1,2]}' ;;
          esac
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "alvo: $TARGET -> $m"

  deploy:
    needs: [test, plan]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
      max-parallel: 1   # servidor 1 depois servidor 2: o LB sempre tem uma instância no ar
      fail-fast: true   # se o servidor 1 falhar, o 2 nem começa (fica a versão boa rodando)
    env:
      APP_DIR: ${{ secrets[format('SERVER{0}_DIR', matrix.server)] }}
      HOST: server${{ matrix.server }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH (servidor 2 via ProxyJump no gateway)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          BASTION_USER: ${{ secrets.BASTION_USER }}
          SERVER1_HOST: ${{ secrets.SERVER1_HOST }}
          SERVER1_USER: ${{ secrets.SERVER1_USER }}
          SERVER2_HOST: ${{ secrets.SERVER2_HOST }}
          SERVER2_USER: ${{ secrets.SERVER2_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          # gateway: a máquina de IP público da empresa. Não roda a aplicação, só serve de salto.
          Host bastion
            HostName $BASTION_HOST
            User $BASTION_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          Host server1
            HostName $SERVER1_HOST
            User $SERVER1_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          Host server2
            HostName $SERVER2_HOST
            User $SERVER2_USER
            ProxyJump bastion   # só alcançável pela LAN do gateway
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          CFG
          chmod 600 ~/.ssh/config
          # só a instância 2 salta pelo gateway; a 1 é SSH direto na VPS
          if [ "$HOST" = server2 ] && [ -z "$BASTION_HOST" ]; then
            echo "secret BASTION_HOST não configurado (necessário para alcançar a instância 2)"; exit 1
          fi
          ssh -o BatchMode=yes "$HOST" 'echo conectado em $(hostname)'

      - name: Deploy no servidor ${{ matrix.server }}
        env:
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          test -n "$APP_DIR" || { echo "secret SERVER${{ matrix.server }}_DIR não configurado"; exit 1; }
          case "$SHA" in *[!0-9a-fA-F]*|'') echo "SHA inválido: $SHA"; exit 1 ;; esac
          # reset --hard em vez de pull: implanta o commit exato que passou no CI, sem sofrer com drift local.
          # --wait: o compose só retorna quando o healthcheck passa, e sai != 0 se não passar — é o que
          # segura o servidor 2 (fail-fast) enquanto o 1 não estiver no ar de novo.
          ssh -o BatchMode=yes "$HOST" "cd '$APP_DIR' \
            && git fetch --prune origin \
            && git reset --hard '$SHA' \
            && docker compose up -d --build --wait --wait-timeout 300 verify"

      - name: Diagnóstico (só em caso de falha)
        if: failure()
        run: |
          ssh -o BatchMode=yes "$HOST" "cd '$APP_DIR' \
            && git log -1 --oneline \
            && docker compose ps \
            && docker compose logs --tail 80 verify | grep -v 'GET /vnc'" || true
